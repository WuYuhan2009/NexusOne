name: build-release

on:
  push:
    branches:
      - main
      - work
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build Release
        run: |
          xcodebuild -scheme NexusOne -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Prepare DMG assets
        run: |
          mkdir -p assets
          if [ ! -f assets/dmg-background.png ]; then
            /usr/bin/sips -s format png /System/Library/CoreServices/DefaultDesktop.heic --out assets/dmg-background.png || true
          fi
          if [ ! -f assets/AppIcon.icns ]; then
            cp /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/ToolbarCustomizeIcon.icns assets/AppIcon.icns
          fi
      - name: Create DMG
        run: |
          APP_PATH=$(find build -name "NexusOne.app" | head -1)
          mkdir -p dist
          create-dmg \
            --volname "NexusOne" \
            --background "assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 800 520 \
            --icon-size 120 \
            --icon "NexusOne.app" 200 260 \
            --hide-extension "NexusOne.app" \
            --app-drop-link 600 260 \
            --volicon "assets/AppIcon.icns" \
            "dist/NexusOne.dmg" \
            "$APP_PATH"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusOne-dmg
          path: dist/NexusOne.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NexusOne-dmg
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NexusOne.dmg
